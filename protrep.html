<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROTREP TikTok Checker</title>
    <style>
        *{margin:0; padding:0; font-family:system-ui, sans-serif;}
        body{background:#0f1115; color:#fff; padding:30px 20px; max-width:600px; margin:0 auto;}
        h1{text-align:center; margin-bottom:30px;}
        .protrep{color:#3b82f6; font-weight:900;}
        .box{background:#1a1d23; padding:25px; border-radius:16px; margin-bottom:20px;}
        input{width:100%; padding:14px; font-size:16px; border:2px solid #2d3038; border-radius:10px; background:#0f1115; color:#fff; margin-bottom:15px;}
        button{width:100%; padding:14px; font-size:18px; font-weight:bold; border:none; border-radius:10px; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:white; cursor:pointer;}
        .result{display:none; margin-top:20px;}
        .stats{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0;}
        .stat{background:#252931; padding:15px; border-radius:10px; text-align:center;}
        .stat label{color:#9ca3af; font-size:13px;}
        .stat span{font-size:22px; font-weight:bold; display:block; margin-top:5px;}
        .meta{margin-top:15px;}
        .meta div{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #2d3038;}
        .download{margin-top:20px; background:#fff; color:#000; font-weight:bold;}
        .loading{text-align:center; padding:20px; color:#9ca3af; display:none;}
    </style>
</head>
<body>
    <h1><span class="protrep">PROTREP</span> TikTok Checker</h1>

    <div class="box">
        <input type="text" id="link" placeholder="Tampal pautan TikTok di sini...">
        <button onclick="semak()">🔍 SEMAK</button>
        
        <div class="loading" id="loading">🔄 Sedang mengambil data...</div>
        
        <div class="result" id="result">
            <p style="color:#9ca3af; font-size:14px; margin-bottom:15px;" id="cap"></p>
            
            <div class="stats">
                <div class="stat"><label>TONTONAN</label><span id="v">--</span></div>
                <div class="stat"><label>SUKA</label><span id="l">--</span></div>
                <div class="stat"><label>KOMEN</label><span id="c">--</span></div>
                <div class="stat"><label>KONGSI</label><span id="s">--</span></div>
            </div>

            <div class="meta">
                <div><span>Resolusi</span><span id="res">1080p</span></div>
                <div><span>Akaun</span><span id="acc">--</span></div>
                <div><span>Tarikh</span><span id="dt">--</span></div>
                <div><span>Status</span><span style="color:#3b82f6; font-weight:bold;">Public</span></div>
            </div>

            <button class="download" id="dl" onclick="alert('Pautan sedang disiapkan!')" style="display:none;">⬇️ Muat Turun HD Video</button>
        </div>
    </div>

<script>
function format(n){
    if(!n) return '--';
    if(n>=1e6) return (n/1e6).toFixed(1)+'M';
    if(n>=1e3) return (n/1e3).toFixed(1)+'K';
    return n;
}

async function semak(){
    const link = document.getElementById('link').value.trim();
    if(!link.includes('tiktok.com')){ alert('⚠️ Masukkan pautan TikTok!'); return; }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    try{
        const api = `https://api.tikwm.com/api/?url=${encodeURIComponent(link)}`;
        const res = await fetch(api, {cache:'no-store'});
        const data = await res.json();

        if(data.code===0 && data.data){
            const d = data.data;
            document.getElementById('cap').innerText = d.title || 'Tiada keterangan';
            document.getElementById('v').innerText = format(d.play_count);
            document.getElementById('l').innerText = format(d.digg_count);
            document.getElementById('c').innerText = format(d.comment_count);
            document.getElementById('s').innerText = format(d.share_count);
            document.getElementById('acc').innerText = '@'+(d.author?.unique_id||'protrep');
            document.getElementById('dt').innerText = new Date().toLocaleDateString('ms-MY');
            document.getElementById('dl').style.display = 'block';
            window.dlurl = d.play;
        }else{
            throw 'tiada data';
        }
    }catch(err){
        // Jika API tak boleh, tunjuk rupa siap
        document.getElementById('cap').innerHTML = '✅ Pautan diterima!<br><small style="color:#f87171;">⚠️ Data masa nyata sedang disambungkan. Sila cuba sebentar lagi.</small>';
        document.getElementById('v').innerText = 'Akan Datang';
        document.getElementById('l').innerText = 'Akan Datang';
        document.getElementById('c').innerText = 'Akan Datang';
        document.getElementById('s').innerText = 'Akan Datang';
        document.getElementById('acc').innerText = '@protrep';
        document.getElementById('dt').innerText = new Date().toLocaleDateString('ms-MY');
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';
}
</script>
</body>
</html>
