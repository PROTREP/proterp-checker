<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROTREP TikTok Checker</title>
    <style>
        *{margin:0; padding:0; font-family:system-ui, sans-serif;}
        body{background:#0f1115; color:#fff; padding:30px 20px; max-width:600px; margin:0 auto;}
        h1{text-align:center; margin-bottom:30px;}
        .protrep{color:#3b82f6; font-weight:900;}
        .box{background:#1a1d23; padding:25px; border-radius:16px;}
        input{width:100%; padding:14px; font-size:16px; border:2px solid #2d3038; border-radius:10px; background:#0f1115; color:#fff; margin-bottom:15px;}
        button{width:100%; padding:14px; font-size:18px; font-weight:bold; border:none; border-radius:10px; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:white; cursor:pointer;}
        button:disabled{opacity:0.6;}
        .result{display:none; margin-top:25px;}
        .stats{display:grid; grid-template-columns:1fr 1fr; gap:15px; margin:20px 0;}
        .stat{background:#252931; padding:20px; border-radius:12px; text-align:center;}
        .stat label{color:#9ca3af; font-size:14px;}
        .stat span{font-size:26px; font-weight:bold; display:block; margin-top:8px;}
        .meta{margin-top:20px;}
        .meta div{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #2d3038;}
        .loading{text-align:center; padding:20px; color:#9ca3af; display:none;}
        .ok{color:#10b981; margin:10px 0;}
        .info{color:#fbbf24; margin:10px 0; font-size:14px;}
    </style>
</head>
<body>
    <h1><span class="protrep">PROTREP</span> TikTok Checker</h1>

    <div class="box">
        <input type="text" id="link" placeholder="Tampal pautan TikTok di sini...">
        <button id="btn" onclick="semak()">🔍 SEMAK</button>
        
        <div class="loading" id="loading">🔄 Mengambil data...</div>
        <div id="msg"></div>
        
        <div class="result" id="result">
            <p class="ok">✅ Pautan sah! Siap semak!</p>
            <p style="color:#d1d5db; margin-bottom:15px;" id="cap"></p>
            
            <div class="stats">
                <div class="stat"><label>TONTONAN</label><span id="v">--</span></div>
                <div class="stat"><label>SUKA</label><span id="l">--</span></div>
                <div class="stat"><label>KOMEN</label><span id="c">--</span></div>
                <div class="stat"><label>KONGSI</label><span id="s">--</span></div>
            </div>

            <div class="meta">
                <div><span>Akaun</span><span id="acc">--</span></div>
                <div><span>Tarikh</span><span id="dt">--</span></div>
                <div><span>Status</span><span style="color:#10b981; font-weight:bold;">Public</span></div>
            </div>
        </div>
    </div>

<script>
function format(n){
    if(!n && n!==0) return '--';
    if(n>=1000000) return (n/1000000).toFixed(1)+'M';
    if(n>=1000) return (n/1000).toFixed(1)+'K';
    return n;
}

async function semak(){
    const link = document.getElementById('link').value.trim();
    const btn = document.getElementById('btn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const msg = document.getElementById('msg');

    if(!link.includes('tiktok.com')){
        msg.innerHTML = '<p style="color:#f87171;">⚠️ Masukkan pautan TikTok yang sah!</p>';
        return;
    }

    msg.innerHTML = '';
    btn.disabled = true;
    loading.style.display = 'block';
    result.style.display = 'none';

    // Cari nama akaun dari pautan
    const username = link.match(/@([^\/]+)/) ? link.match(/@([^\/]+)/)[1] : 'protrep';
    // Cari tajuk video (ringkas)
    const title = link.substring(0, 40) + '...';

    try{
        // Cuba ambil data automatik — kalau boleh keluar
        const proxy = 'https://corsproxy.io/?' + encodeURIComponent('https://api.tikwm.com/api/?url=' + link);
        const res = await fetch(proxy, { signal: AbortSignal.timeout(15000) });
        const data = await res.json();

        if(data.code === 0 && data.data){
            document.getElementById('cap').innerText = data.data.title || title;
            document.getElementById('v').innerText = format(data.data.play_count);
            document.getElementById('l').innerText = format(data.data.digg_count);
            document.getElementById('c').innerText = format(data.data.comment_count);
            document.getElementById('s').innerText = format(data.data.share_count);
        } else {
            // Kalau tak boleh — tunjuk borang mudah masuk
            document.getElementById('cap').innerText = title;
            document.getElementById('v').innerHTML = '<input type="number" placeholder="Tontonan" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
            document.getElementById('l').innerHTML = '<input type="number" placeholder="Suka" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
            document.getElementById('c').innerHTML = '<input type="number" placeholder="Komen" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
            document.getElementById('s').innerHTML = '<input type="number" placeholder="Kongsi" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
            
            msg.innerHTML = '<p class="info">💡 Masukkan nombor dari TikTok secara manual — cepat je!</p>';
        }

        document.getElementById('acc').innerText = '@' + username;
        document.getElementById('dt').innerText = new Date().toLocaleDateString('ms-MY');
        result.style.display = 'block';

    }catch(err){
        // Kalau semua tak boleh — tunjuk borang mudah
        document.getElementById('cap').innerText = title;
        document.getElementById('v').innerHTML = '<input type="number" placeholder="Tontonan" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
        document.getElementById('l').innerHTML = '<input type="number" placeholder="Suka" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
        document.getElementById('c').innerHTML = '<input type="number" placeholder="Komen" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
        document.getElementById('s').innerHTML = '<input type="number" placeholder="Kongsi" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0f1115; color:#fff; text-align:center;">';
        
        document.getElementById('acc').innerText = '@' + username;
        document.getElementById('dt').innerText = new Date().toLocaleDateString('ms-MY');
        result.style.display = 'block';
        
        msg.innerHTML = '<p class="info">💡 Masukkan nombor dari TikTok secara manual — cepat je!</p>';
    }

    loading.style.display = 'none';
    btn.disabled = false;
}
</script>
</body>
</html>
